<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion - AFRIX</title>
  <link rel="stylesheet" href="../styles.css?v=20260609-5">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-intro">
      <a class="brand" href="/">
        <span class="brand-mark">A</span>
        <span><strong>AFRIX</strong><small>Capital Investment</small></span>
      </a>
      <span class="pill">Accès confidentiel</span>
      <h1>Accédez à votre espace partenaire.</h1>
      <p>Connectez-vous avec uniquement votre email et votre mot de passe.</p>
      <div class="auth-chain" aria-label="Réseau blockchain">
        <span><strong>USDT</strong><small>Wallet</small></span>
        <span><strong>Web3</strong><small>Access</small></span>
        <span><strong>Node</strong><small>Secure</small></span>
      </div>
    </section>
    <form class="auth-card" data-login-form>
      <span class="form-kicker">Espace sécurisé</span>
      <h2>Connexion</h2>
      <label>Email<input type="email" name="email" required></label>
      <label>Mot de passe<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn primary full" type="submit">Se connecter</button>
      <p><a href="/reset-password">Mot de passe oublié ?</a></p>
      <p>Pas encore de compte ? <a href="/register">Créer un compte</a></p>
    </form>
  </main>
  <script src="../app.js?v=20260615-1"></script>
</body>
</html>
