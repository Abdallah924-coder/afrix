<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion - AFRIX</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-intro">
      <a class="brand" href="../index.html">
        <span class="brand-mark">A</span>
        <span><strong>AFRIX</strong><small>Capital Investment</small></span>
      </a>
      <h1>Accédez à votre espace partenaire.</h1>
      <p>Suivez votre solde, vos demandes, vos plans actifs et votre réseau.</p>
    </section>
    <form class="auth-card" data-login-form>
      <h2>Connexion</h2>
      <label>Email<input type="email" name="email" required></label>
      <label>Mot de passe<input type="password" name="password" required></label>
      <button class="btn primary full" type="submit">Se connecter</button>
      <p>Pas encore de compte ? <a href="register.html">Créer un compte</a></p>
    </form>
  </main>
  <script src="../app.js"></script>
</body>
</html>
