<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f5d43">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/pwa-icon.svg">
  <link rel="shortcut icon" href="/assets/pwa-icon.svg">
  <link rel="apple-touch-icon" href="/assets/pwa-icon.svg">
  <meta property="og:image" content="/assets/pwa-icon.svg">
  <meta name="twitter:image" content="/assets/pwa-icon.svg">
  <title>Profil - AFRIX</title>
  <link rel="stylesheet" href="../styles.css?v=20260706-1">
</head>
<body data-protected data-page="profile">
  <aside class="sidebar" data-sidebar></aside>
  <main class="app">
    <header class="topbar" data-topbar></header>
    <section class="grid two">
      <article class="panel">
        <div class="panel-head"><h1>Profil</h1><span class="badge" data-profile-role>Utilisateur</span></div>
        <div class="profile-avatar-block">
          <img data-profile-avatar alt="Photo de profil AFRIX" hidden>
          <div data-profile-avatar-fallback>AF</div>
        </div>
        <div class="list">
          <div><span>Email</span><strong data-profile-email>-</strong></div>
          <div><span>Pays</span><strong data-profile-country>-</strong></div>
          <div><span>Solde</span><strong data-profile-balance>0 USDT</strong></div>
          <div><span>Activite</span><strong data-profile-activity-grsc>0.0000 GRSC</strong><small data-profile-activity-grsc-usdt>≈ 0.0000 USDT</small><small data-profile-activity-usdt>≈ 0.0000 USDT</small></div>
          <div><span>Activite AUSD</span><strong data-profile-activity-ausd>0.0000 AUSD</strong><small data-profile-activity-ausd-usdt>≈ 0.0000 USDT</small></div>
        </div>
      </article>
      <form class="panel" data-profile-form enctype="multipart/form-data">
        <div class="panel-head"><h1>Informations</h1><span class="badge">Compte</span></div>
        <label>Pays
          <select name="country" autocomplete="country-name" required data-profile-country-input>
            <option value="">Choisir un pays</option>
          </select>
        </label>
        <label>Photo de profil
          <input name="avatar" type="file" accept="image/*" data-profile-avatar-input>
        </label>
        <p class="muted">Image JPG, PNG ou WebP. Taille maximale: 1 Mo.</p>
        <button class="btn primary full" type="submit">Mettre à jour le profil</button>
      </form>
      <form class="panel" data-change-password-form>
        <div class="panel-head"><h1>Mot de passe</h1><span class="badge">Sécurité</span></div>
        <label>Mot de passe actuel
          <input name="currentPassword" type="password" required>
        </label>
        <label>Nouveau mot de passe
          <input name="newPassword" type="password" minlength="10" required>
        </label>
        <button class="btn primary full" type="submit">Changer le mot de passe</button>
      </form>
      <article class="panel">
        <div class="panel-head"><h1>Liens rapides</h1><span class="badge">Accès</span></div>
        <div class="profile-links">
          <a class="btn secondary full" href="/network">RÉSEAU</a>
          <a class="btn secondary full" href="/support">SUPPORT</a>
          <a class="btn secondary full" href="/elite">ELITE</a>
        </div>
      </article>
    </section>
  </main>
  <script src="../app.js?v=20260706-1"></script>
</body>
</html>
